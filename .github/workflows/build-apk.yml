name: Compilar APK Matibatidos RC6 FCM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Validar y compilar Matibatidos RC6
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar y extraer el proyecto RC6
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO.zip"

          if [[ ! -s "$ZIP" ]]; then
            echo "::error::No se encontró '$ZIP' en la raíz del repositorio. Revisa el nombre exacto y vuelve a subir el ZIP."
            echo "Archivos disponibles en la raíz:"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted_rc6
          unzip -q "$ZIP" -d extracted_rc6

          mapfile -t SETTINGS_FILES < <(find extracted_rc6 -type f -name settings.gradle -not -path '*/.git/*')
          if [[ ${#SETTINGS_FILES[@]} -ne 1 ]]; then
            echo "::error::El ZIP debe contener exactamente un settings.gradle; encontrados: ${#SETTINGS_FILES[@]}."
            find extracted_rc6 -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto detectado: $PROJECT_DIR"

      - name: Validar Firebase, estructura y versión
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in settings.gradle build.gradle gradle.properties app/build.gradle \
                   app/google-services.json app/src/main/AndroidManifest.xml \
                   app/src/main/assets/index.html \
                   app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java \
                   app/src/main/java/com/matibatidos/pos/rc6/MatiFirebaseMessagingService.java \
                   Api_Matibatidos_Delivery.gs; do
            [[ -s "$f" ]] || { echo "::error::Falta el archivo requerido: $f"; exit 1; }
          done

          grep -Fq "applicationId 'com.matibatidos.pos.rc6'" app/build.gradle || {
            echo "::error::El applicationId no coincide con el paquete RC6 esperado."; exit 1;
          }
          grep -Fq "id 'com.google.gms.google-services'" app/build.gradle || {
            echo "::error::Falta el plugin Google Services."; exit 1;
          }
          grep -Fq "com.google.firebase:firebase-messaging" app/build.gradle || {
            echo "::error::Falta Firebase Messaging."; exit 1;
          }
          grep -Fq 'MatiFirebaseMessagingService' app/src/main/AndroidManifest.xml || {
            echo "::error::No está declarado el servicio de notificaciones."; exit 1;
          }

          python3 - <<'PY'
          import json
          p = 'app/google-services.json'
          with open(p, encoding='utf-8') as f:
              cfg = json.load(f)
          info = cfg.get('project_info', {})
          if info.get('project_id') != 'matibatidos-online':
              raise SystemExit('ERROR: google-services.json no pertenece a matibatidos-online')
          if str(info.get('project_number')) != '390868871532':
              raise SystemExit('ERROR: project_number no coincide con Firebase Matibatidos')
          packages = [
              c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for c in cfg.get('client', [])
          ]
          if 'com.matibatidos.pos.rc6' not in packages:
              raise SystemExit('ERROR: Firebase no contiene el paquete com.matibatidos.pos.rc6')
          print('Firebase verificado: proyecto y paquete Android coinciden.')
          PY

      - name: Preparar bibliotecas web usadas por el POS
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS="app/src/main/assets"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
            --output "$ASSETS/xlsx.full.min.js"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
            --output "$ASSETS/chart.umd.min.js"
          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          echo "Bibliotecas Excel y gráficos preparadas."

      - name: Instalar componentes Android requeridos
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK y paquete
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || { echo "::error::Gradle terminó sin generar la APK esperada."; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.matibatidos.pos.rc6'"
          sha256sum "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-FCM-1.2.5
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
